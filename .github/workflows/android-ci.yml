name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-test-and-build:
    name: Debug Unit Tests & APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Debug unit tests & assemble Debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload JUnit XML test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-unit-test-results
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  release-r8-verify:
    name: Release R8 Build & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore (if configured in Secrets)
        env:
          KEYSTORE_B64: ${{ secrets.SCREENTRACE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "${RUNNER_TEMP}/release.jks"
            echo "SCREENTRACE_KEYSTORE_PATH=${RUNNER_TEMP}/release.jks" >> "$GITHUB_ENV"
          else
            echo "No release keystore secret configured; building unsigned release APK."
          fi

      - name: Run Release unit tests & assemble Release APK (R8 enabled)
        env:
          SCREENTRACE_KEYSTORE_PASSWORD: ${{ secrets.SCREENTRACE_KEYSTORE_PASSWORD }}
          SCREENTRACE_KEY_ALIAS: ${{ secrets.SCREENTRACE_KEY_ALIAS }}
          SCREENTRACE_KEY_PASSWORD: ${{ secrets.SCREENTRACE_KEY_PASSWORD }}
        run: ./gradlew :app:testReleaseUnitTest :app:assembleRelease --stacktrace

      - name: Verify signed Release APK with apksigner
        run: |
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
            "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk
          else
            echo "Unsigned release APK build; skipping apksigner verify."
          fi

      - name: Upload Release APK & R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: app-release-artifacts
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
